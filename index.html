<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ithihasa Anubhava – NRITYA &amp; NAADAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Marck+Script&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Crimson Text', Georgia, serif;
      color: #ecbad2;
      background: #1a0a0a;
    }

    /* NAV */
    nav {
      background: #b83c0c;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .nav-logos { display: flex; align-items: center; gap: 0.75rem; }
    .nav-logos img { height: 48px; width: auto; }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; }
    .nav-links a {
      color: #ecbad2;
      text-decoration: none;
      font-family: 'Crimson Text', serif;
      font-size: 1.05rem;
      letter-spacing: 0.03em;
      transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 0.75; }

    /* HERO */
    .hero {
      width: 100%;
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('bg.png');
      background-size: cover;
      background-position: center top;
      z-index: 0;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 0, 5, 0.45);
      z-index: 1;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 3rem 2rem;
      max-width: 700px;
    }
    .hero-content h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(3rem, 9vw, 6rem);
      color: #ecbad2;
      text-shadow: 0 3px 20px rgba(0,0,0,0.6);
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }
    .hero-content .subtitle {
      font-family: 'Marck Script', cursive;
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      color: #ecbad2;
      opacity: 0.9;
      margin-bottom: 1.5rem;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .hero-content .details {
      font-family: 'Crimson Text', serif;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: #ecbad2;
      opacity: 0.85;
      line-height: 1.8;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }
    .hero-btns {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 0.65rem 1.75rem;
      border-radius: 30px;
      font-family: 'Crimson Text', serif;
      font-size: 1.05rem;
      text-decoration: none;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn:hover { transform: translateY(-2px); opacity: 0.9; }
    .btn-primary { background: #b83c0c; color: #ecbad2; }
    .btn-secondary { background: transparent; border: 2px solid #ecbad2; color: #ecbad2; }

    footer {
      background: rgba(0,0,0,0.6);
      text-align: center;
      padding: 1.25rem 1rem;
      font-size: 0.85rem;
      color: #ecbad2;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-logos">
    <img src="nritya_logo_transparent.png" alt="NRITYA logo"/>
    <img src="naadam_logo_pink.png" alt="NAADAM logo"/>
  </div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="dancers.html">Dancers</a></li>
    <li><a href="musicians.html">Musicians</a></li>
    <li><a href="program.html">Program</a></li>
    <li><a href="support.html">Support Us</a></li>
  </ul>
</nav>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1>Ithihasa Anubhava</h1>
    <div class="subtitle">An Evening of Classical Indian Dance &amp; Music</div>
    <div class="details">
      Presented by NRITYA &amp; NAADAM<br/>
      Case Western Reserve University
    </div>
    <div class="hero-btns">
      <a href="program.html" class="btn btn-primary">View Program</a>
      <a href="support.html" class="btn btn-secondary">Support Us</a>
    </div>
  </div>
</section>

<footer>
  &copy; 2025 NRITYA &amp; NAADAM · Case Western Reserve University
</footer>

</body>
</html>
